name: Build Assembly AR Pose-Guided Beta APK
on:
  push:
    branches: [main]
    paths:
      - 'android-poseguided-source.b64'
      - '.github/workflows/build-poseguided-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore Android project
        run: |
          mkdir -p android-poseguided
          base64 -d android-poseguided-source.b64 > /tmp/assembly-poseguided.zip
          unzip -q /tmp/assembly-poseguided.zip -d android-poseguided
      - name: Build APK
        run: gradle -p android-poseguided :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssemblyAR-PoseGuided-0.4.0-APK
          path: android-poseguided/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
