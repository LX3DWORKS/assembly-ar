name: LX3D Scanner APK
on:
  push:
    branches: [ lx3dscanner-apk-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract and verify LX3D Scanner source
        run: |
          cat lx3dscanner/payload/part*.txt | base64 --decode > /tmp/lxscanslim.tar.xz
          echo "f657347a70e587a34abfc5fb0c238dc7a3fac5437f326ac559fe1919a4ed5c20  /tmp/lxscanslim.tar.xz" | sha256sum --check
          mkdir -p lx3dscanner/project
          tar -xJf /tmp/lxscanslim.tar.xz -C lx3dscanner/project
          cat lx3dscanner/v02delta/part*.txt | base64 --decode > /tmp/lx3d_v02_delta.tar.xz
          echo "7e41804178e7407a4eef29dba8b20d5ceb18c93a2ff24bf1ae68b06ab498c146  /tmp/lx3d_v02_delta.tar.xz" | sha256sum --check
          tar -xJf /tmp/lx3d_v02_delta.tar.xz -C lx3dscanner/project
          (cd lx3dscanner/project && patch -p1 < lx3d_v02_changes.patch)
          cat lx3dscanner/v03patch/part*.txt | base64 --decode > /tmp/lx3d_v03_patch.tar.xz
          echo "f28be71636e4caac983a78048c2b6f86ac46a955a4fdfdd669024ee28ca5728b  /tmp/lx3d_v03_patch.tar.xz" | sha256sum --check
          mkdir -p /tmp/lx3d_v03_patch
          tar -xJf /tmp/lx3d_v03_patch.tar.xz -C /tmp/lx3d_v03_patch
          for patchfile in /tmp/lx3d_v03_patch/lx3d_v03_{cam,activity,gradle,readme}.patch; do
            (cd lx3dscanner/project && patch --batch -p1 < "$patchfile")
          done
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n' > lx3dscanner/project/gradle.properties
      - name: Build signed debug APK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon -p lx3dscanner/project :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LX3DScanner-Installable-APK
          path: lx3dscanner/project/app/build/outputs/apk/debug/app-debug.apk
