name: Build Assembly AR Native APK
on:
  push:
    branches: [main]
    paths:
      - "android-native-source.b64"
      - ".github/workflows/build-assembly-native.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore native Android source
        run: |
          mkdir -p android-native
          base64 -d android-native-source.b64 > /tmp/assembly-native-source.zip
          unzip -q /tmp/assembly-native-source.zip -d android-native
      - name: Compile debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: AssemblyAR-Native-Alpha-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
