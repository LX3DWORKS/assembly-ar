name: Build Assembly AR AutoFind Beta APK
on:
  push:
    branches: [main]
    paths:
      - 'android-autofind-source.b64'
      - '.github/workflows/build-assembly-autofind.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore AutoFind Android project
        run: |
          mkdir -p android-autofind
          base64 -d android-autofind-source.b64 > /tmp/autofind-native.zip
          unzip -q /tmp/autofind-native.zip -d android-autofind
      - name: Compile AutoFind beta debug APK
        run: gradle -p android-autofind :app:assembleDebug --stacktrace --no-daemon
      - name: Upload AutoFind installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AssemblyAR-AutoFind-0.3.0-APK
          path: android-autofind/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
